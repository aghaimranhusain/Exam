const sess=document.getElementById("session"),inp=document.getElementById("roll"),btn=document.getElementById("btn");
const res=document.getElementById("result"),err=document.getElementById("err");
function n(s){return String(s||"").trim().toUpperCase().replace(/\s+/g,"")}
function find(q,s){q=n(q);if(!q)return null;let m=D.find(r=>r.Session===s&&n(r["Roll Number"])===q);if(m)return m;return D.find(r=>r.Session===s&&n(r["Roll Number"]).includes(q))||null}
function go(){
  const q=inp.value.trim(),s=sess.value;err.classList.remove("show");inp.classList.remove("error");res.classList.remove("show");
  if(!q){err.innerHTML="❌ Please enter your Roll Number";err.classList.add("show");inp.classList.add("error");alert("Please enter your Roll Number");return}
  if(q.length<13){err.innerHTML="❌ Incomplete Roll Number<br>Enter the full 13-character Roll Number";err.classList.add("show");inp.classList.add("error");alert("Incomplete Roll Number");return}
  const f=find(q,s);
  if(!f){err.innerHTML="❌ No seat found for \""+q+"\"<br>in "+s;err.classList.add("show");inp.classList.add("error");alert("No seat found");return}
  res.classList.add("show");
  document.getElementById("seat").textContent=(f.Column&&f.Row)?(f.Column+"  •  "+f.Row):"—";
  document.getElementById("room").textContent="Room: "+(f.Room||"—");
  document.getElementById("block").textContent=f.Block?("📍 "+f.Block):"";
  let m="";if(f.Program)m+="<strong>Program:</strong><br>"+f.Program+"<br><br>";
  if(f.Session)m+="<strong>Session:</strong> "+f.Session+"<br>";
  if(f.Date)m+="<strong>Date:</strong> "+f.Date+"<br>";

  document.getElementById("hint").textContent=h;
}
btn.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};inp.oninput=()=>{err.classList.remove("show");inp.classList.remove("error")};
