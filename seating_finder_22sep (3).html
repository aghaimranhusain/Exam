  <style>
    :root { --primary: #1F4E79; --accent: #2E75B6; --danger: #e74c3c; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #e8f4fd 0%, #f5f9fc 100%);
      min-height: 100vh; color: #222; padding: 1rem;
    }
    .container { max-width: 480px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 1.2rem; padding-top: 0.5rem; }
    header h1 { font-size: 1.55rem; color: var(--primary); font-weight: 700; }
    header p { color: #666; font-size: 0.95rem; margin-top: 0.25rem; }
    .card {
      background: #fff; border-radius: 16px; padding: 1.3rem;
      box-shadow: 0 8px 24px rgba(31, 78, 121, 0.12); margin-bottom: 1rem;
    }
    label {
      display: block; font-size: 0.78rem; font-weight: 600; color: #555;
      margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.4px;
    }
    select, input[type="text"] {
      width: 100%; padding: 0.85rem 1rem; font-size: 1.05rem;
      border: 2px solid #d0e3f0; border-radius: 10px; outline: none;
      margin-bottom: 0.9rem; background: #fff;
    }
    select:focus, input[type="text"]:focus { border-color: var(--accent); }
    input.error { border-color: #e74c3c !important; background: #fff5f5; }
    button {
      width: 100%; padding: 0.95rem; font-size: 1.05rem; font-weight: 600;
      background: var(--accent); color: white; border: none; border-radius: 10px; cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    .result { display: none; animation: fadeIn 0.3s ease; }
    .result.show { display: block; }
    .seat-display { text-align: center; padding: 0.9rem 0 0.4rem; }
    .seat-big { font-size: 1.85rem; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
    .room-line { font-size: 1.2rem; font-weight: 600; color: #1a5276; margin-top: 0.35rem; }
    .block-line { font-size: 0.98rem; color: #2874a6; margin-top: 0.15rem; }
    .meta { margin-top: 0.9rem; font-size: 0.9rem; color: #555; line-height: 1.55; text-align: left; }
    .meta strong { color: #333; }
    .not-found {
      background: #fdecea; color: #c0392b; padding: 1.1rem; border-radius: 10px;
      border: 2px solid #e74c3c; display: none; margin-top: 0.9rem;
      font-size: 0.98rem; font-weight: 500; text-align: center; animation: shake 0.4s ease;
    }
    .not-found.show { display: block; }
    .hint {
      background: #e8f8f0; color: #1e8449; padding: 0.75rem 1rem; border-radius: 10px;
      font-size: 0.95rem; margin-top: 0.75rem; text-align: center; font-weight: 500;
    }
    .status { text-align: center; font-size: 0.78rem; color: #888; margin-top: 0.7rem; }
    footer { text-align: center; margin-top: 1.8rem; font-size: 0.75rem; color: #aaa; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>

    const sessionSelect = document.getElementById("session");
    const rollInput = document.getElementById("roll");
    const searchBtn = document.getElementById("searchBtn");
    const resultDiv = document.getElementById("result");
    const notFoundDiv = document.getElementById("notFound");
    const seatText = document.getElementById("seatText");
    const roomText = document.getElementById("roomText");
    const blockText = document.getElementById("blockText");
    const metaText = document.getElementById("metaText");
    const hintText = document.getElementById("hintText");

    function normalize(str) {
      return String(str || "").trim().toUpperCase().replace(/\s+/g, "");
    }

    function findSeat(query, session) {
      const q = normalize(query);
      if (!q) return null;
      let match = seatingData.find(function(r) {
        return r["Session"] === session && normalize(r["Roll Number"]) === q;
      });
      if (match) return match;
      match = seatingData.find(function(r) {
        return r["Session"] === session && normalize(r["Roll Number"]).indexOf(q) !== -1;
      });
      return match || null;
    }

    function clearError() {
      notFoundDiv.classList.remove("show");
      rollInput.classList.remove("error");
    }

    function showNotFound(msg) {
      resultDiv.classList.remove("show");
      notFoundDiv.classList.add("show");
      notFoundDiv.innerHTML = msg;
      rollInput.classList.add("error");
    }

    function showResult(row) {
      clearError();
      resultDiv.classList.add("show");
      var col = row["Column"] || "";
      var r = row["Row"] || "";
      var room = row["Room"] || "—";
      var block = row["Block"] || "";
      seatText.textContent = (col && r) ? (col + "  •  " + r) : "—";
      roomText.textContent = "Room: " + room;
      blockText.textContent = block ? ("📍 " + block) : "";
      var meta = "";
      if (row["Program"]) meta += "<strong>Program / Subject:</strong><br>" + row["Program"] + "<br><br>";
      if (row["Session"]) meta += "<strong>Session:</strong> " + row["Session"] + "<br>";
      if (row["Date"]) meta += "<strong>Date:</strong> " + row["Date"] + "<br>";
      meta += "<strong>Roll:</strong> " + row["Roll Number"];
      metaText.innerHTML = meta;
      var hint = "📍 Go to " + room;
      if (block) hint += " (" + block + ")";
      if (col && r) hint += " → " + col + ", " + r;
      hintText.textContent = hint;
    }

    function doSearch() {
      var query = rollInput.value.trim();
      var session = sessionSelect.value;
      clearError();

      if (!query) {
        showNotFound("❌ <strong>Please enter your Roll Number</strong><br>The box cannot be empty.");
        alert("Please enter your Roll Number.");
        rollInput.focus();
        return;
      }

      if (query.length < 13) {
        showNotFound("❌ <strong>Incomplete Roll Number</strong><br>Please enter the full 13-character Roll Number.<br>(Example: 2K24LWUN01035)");
        alert("Incomplete Roll Number.\n\nPlease enter the full 13-character Roll Number.\nExample: 2K24LWUN01035");
        rollInput.focus();
        return;
      }

      var found = findSeat(query, session);

      if (found) {
        showResult(found);
      } else {
        showNotFound("❌ <strong>No seat found</strong> for \"" + query + "\"<br>in " + session + ".<br>Please check the Roll Number / Session.");
        alert("No seat found for \"" + query + "\" in " + session + ".\n\nPlease check the Roll Number and selected Session.");
      }
    }

    searchBtn.addEventListener("click", doSearch);
    rollInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") doSearch();
    });
    rollInput.addEventListener("input", function() { clearError(); });
    sessionSelect.addEventListener("change", function() {
      clearError();
      resultDiv.classList.remove("show");
    });
    rollInput.focus();
  </script>
